[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imgintel"
version = "0.1.0"
description = "Cross-platform CLI for extracting intelligence from images"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "vivek" }]
keywords = ["osint", "forensics", "exif", "image", "intelligence"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Multimedia :: Graphics",
]

# Phase 0-1 needs nothing heavy: no scipy, no opencv, no ML runtime.
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "pillow>=10.2",
    "numpy>=1.26",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
# Richer EXIF (XMP/IPTC/MakerNotes) via the exiftool binary.
exif = ["pyexiftool>=0.5.6"]
# Offline timezone lookup — enables the GPS/EXIF timestamp cross-check.
timezone = ["timezonefinder>=6.5"]
# Offline place names. Split out because reverse_geocoder is sdist-only and
# builds from source; if it fails on a new interpreter, `[timezone]` and the
# rest of the tool must still install.
places = ["reverse_geocoder>=1.5.1"]
geo = ["imgintel[timezone,places]"]
# OCR. RapidOCR ships PP-OCR weights inside the wheel, so this needs no model
# download and stays pure-wheel on every platform.
#
# `rapidocr` is the renamed successor to `rapidocr-onnxruntime`, which caps at
# Python <3.13 and therefore cannot be installed on current interpreters. The
# analyzer accepts either package if one is already present.
ocr = ["rapidocr>=3.0", "onnxruntime>=1.17"]
# QR/barcode. zxing-cpp over pyzbar: self-contained wheels, no system libzbar.
codes = ["zxing-cpp>=2.2"]
lang = ["lingua-language-detector>=2.0"]
# YAML rule files. JSON rule files work without this.
rules = ["pyyaml>=6.0"]
pii = ["phonenumbers>=8.13"]
# Object detection: YOLOX-S on onnxruntime. Apache-2.0 weights, no AGPL.
detect = ["onnxruntime>=1.17"]
# Face detection (YuNet) and logo reference matching (ORB) both use OpenCV.
faces = ["opencv-python-headless>=4.9"]
logo = ["opencv-python-headless>=4.9"]
dev = [
    "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5",
    "piexif>=1.1.3", "segno>=1.6",
]
all = ["imgintel[exif,geo,ocr,codes,lang,pii,detect,faces,logo,rules]"]

[project.scripts]
imgintel = "imgintel.cli:main"

# Third-party analyzers register here; see docs/PLUGINS.md
[project.entry-points."imgintel.analyzers"]

[project.urls]
Homepage = "https://github.com/vivek/image-intel"

[tool.hatch.build.targets.wheel]
packages = ["src/imgintel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: tests that install packages or otherwise take real time",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
